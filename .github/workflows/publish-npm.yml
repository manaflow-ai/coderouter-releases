name: publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable X.Y.Z release version
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: npm-coderouter
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org
      - name: Download verified npm package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir dist
          gh release download "v$VERSION" \
            --pattern coderouter-npm-launcher.tgz \
            --pattern SHA256SUMS \
            --dir dist
          (cd dist && grep 'coderouter-npm-launcher.tgz$' SHA256SUMS | sha256sum --check)
          [[ "$(tar -xOf dist/coderouter-npm-launcher.tgz package/package.json | jq -r .version)" == "$VERSION" ]]
      - run: npm install -g npm@11.5.1
      - name: Publish through npm trusted publishing
        run: npm publish --provenance ./dist/coderouter-npm-launcher.tgz
