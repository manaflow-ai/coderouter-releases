name: verify release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        type: string

permissions: {}

jobs:
  verify:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$TAG" --dir dist
          (cd dist && sha256sum --check SHA256SUMS)
          jq -e --arg version "${TAG#v}" '.version == $version' dist/manifest.json
      - name: Smoke-test Linux binary
        run: |
          chmod 0755 dist/coderouter-linux-x64
          dist/coderouter-linux-x64 --version
