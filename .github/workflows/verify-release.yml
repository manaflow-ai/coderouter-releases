name: verify release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        type: string

permissions: {}

concurrency:
  group: verify-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the published release
    # Release events are read-only. Manual verification is limited to the
    # protected main workflow so a feature branch cannot choose the code that
    # runs against public registries.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # This job executes downloaded package launchers. Keep it on an ephemeral
    # GitHub-hosted runner instead of a persistent third-party runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Pin the workflow source
        env:
          EXPECTED_WORKFLOW: verify-release.yml
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == manaflow-ai/coderouter-releases ]]
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              [[ "$GITHUB_REF" == refs/heads/main ]]
              [[ "$GITHUB_REF_PROTECTED" == true ]]
              [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/$EXPECTED_WORKFLOW@refs/heads/main" ]]
              [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
              ;;
            release)
              [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/$EXPECTED_WORKFLOW@"* ]]
              [[ "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
              [[ "$GITHUB_REF_PROTECTED" == true ]]
              ;;
            *)
              printf 'unexpected event: %s\n' "$GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
      - id: release
        name: Select release
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "release tag must use vX.Y.Z" >&2
            exit 1
          }
          printf 'tag=%s\nversion=%s\n' "$TAG" "${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - name: Verify release tag ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: .github/scripts/verify-release-tag.sh "$VERSION"
      - name: Download immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir dist
          gh release download "$TAG" --dir dist
          awk '
            NF != 2 || length($1) != 64 || $1 !~ /^[0-9a-fA-F]+$/ || index($2, "/") > 0 || $2 ~ /^-/ { exit 1 }
            ++seen[$2] != 1 { exit 1 }
          ' dist/SHA256SUMS || {
            echo "malformed SHA256SUMS" >&2
            exit 1
          }
          (cd dist && sha256sum --check SHA256SUMS)
          jq -e --arg version "$VERSION" '
            .version == $version and
            .source_tag == ("coderouter-v" + $version) and
            (.source_commit | test("^[0-9a-f]{40}$"))
          ' dist/manifest.json
          manifest_linux_sha="$(jq -er '.binaries["coderouter-linux-x64"]' dist/manifest.json)"
          [[ "$manifest_linux_sha" == "$(sha256sum dist/coderouter-linux-x64 | cut -d' ' -f1)" ]]
          test -f "dist/coderouter-$VERSION-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          test -f dist/coderouter-npm-launcher.tgz
      - name: Smoke-test Linux binary
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          chmod 0755 dist/coderouter-linux-x64
          [[ "$(dist/coderouter-linux-x64 --version)" == "coderouter $VERSION" ]]
      - name: Smoke-test public package launchers
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == x86_64 ]]
          identity_script=.github/scripts/verify-package-identity.sh
          expected_wheel="coderouter-$VERSION-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          expected_npm_sha="$(sha256sum dist/coderouter-npm-launcher.tgz | cut -d' ' -f1)"
          expected_wheel_sha="$(sha256sum "dist/$expected_wheel" | cut -d' ' -f1)"
          grep -Fqx "$expected_npm_sha  coderouter-npm-launcher.tgz" dist/SHA256SUMS
          grep -Fqx "$expected_wheel_sha  $expected_wheel" dist/SHA256SUMS
          npm_metadata="$RUNNER_TEMP/coderouter-npm-metadata.json"
          pypi_metadata="$RUNNER_TEMP/coderouter-pypi-metadata.json"
          npm_package="$RUNNER_TEMP/coderouter-npm-package.json"
          tar -xOf dist/coderouter-npm-launcher.tgz package/package.json > "$npm_package"
          npm_url=""
          pypi_url=""
          for attempt in {1..20}; do
            npm_tmp="$npm_metadata.$attempt"
            pypi_tmp="$pypi_metadata.$attempt"
            curl -fsSL \
              --connect-timeout 10 \
              --max-time 30 \
              --max-filesize 1048576 \
              -H 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/coderouter/$VERSION" \
              -o "$npm_tmp" || true
            curl -fsSL \
              --connect-timeout 10 \
              --max-time 30 \
              --max-filesize 1048576 \
              -H 'Cache-Control: no-cache' \
              "https://pypi.org/pypi/coderouter/$VERSION/json?attempt=$attempt" \
              -o "$pypi_tmp" || true
            [[ -s "$npm_tmp" ]] && mv "$npm_tmp" "$npm_metadata" || true
            [[ -s "$pypi_tmp" ]] && mv "$pypi_tmp" "$pypi_metadata" || true
            if [[ -s "$npm_metadata" && -s "$pypi_metadata" ]] \
              && "$identity_script" "$VERSION" "$npm_metadata" "$pypi_metadata" \
                "$npm_package" "$expected_wheel_sha"; then
              npm_url="$(jq -er '.dist.tarball' "$npm_metadata")"
              pypi_url="$(jq -er --arg wheel "$expected_wheel" \
                '.urls[] | select(.packagetype == "bdist_wheel" and .filename == $wheel) | .url' \
                "$pypi_metadata")"
              break
            fi
            [[ "$attempt" -lt 20 ]] || {
              echo "registries did not expose the verified coderouter $VERSION artifacts in time" >&2
              exit 1
            }
            sleep 15
          done
          npm_artifact="$RUNNER_TEMP/coderouter-$VERSION.tgz"
          wheel_artifact="$RUNNER_TEMP/$expected_wheel"
          curl -fsSL --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 --max-filesize 67108864 \
            "$npm_url" -o "$npm_artifact"
          printf '%s  %s\n' "$expected_npm_sha" "$npm_artifact" | sha256sum --check >/dev/null
          tar -xOf "$npm_artifact" package/package.json \
            | jq -e --arg version "$VERSION" \
              '.name == "coderouter" and .version == $version and
               .bin.coderouter == "bin/coderouter.js" and .bin.cr == "bin/coderouter.js"' >/dev/null
          curl -fsSL --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 --max-filesize 67108864 \
            "$pypi_url" -o "$wheel_artifact"
          printf '%s  %s\n' "$expected_wheel_sha" "$wheel_artifact" | sha256sum --check >/dev/null
          mapfile -t metadata_paths < <(
            unzip -Z1 "$wheel_artifact" | grep -E '^[^/]+\.dist-info/METADATA$'
          )
          [[ "${#metadata_paths[@]}" -eq 1 ]]
          unzip -p "$wheel_artifact" "${metadata_paths[0]}" \
            | awk -v version="$VERSION" '
                /^Name: / { name = $0 }
                /^Version: / { release = $0 }
                END { exit !(name == "Name: coderouter" && release == "Version: " version) }
              '
          npm_config_cache="$RUNNER_TEMP/npm-cache" \
          npm_config_registry=https://registry.npmjs.org \
          npm_config_ignore_scripts=true \
            npx --yes "coderouter@$VERSION" --version \
            | grep -Fx "coderouter $VERSION"
          npm_config_cache="$RUNNER_TEMP/npm-cache" \
          npm_config_registry=https://registry.npmjs.org \
          npm_config_ignore_scripts=true \
            npm exec --yes --package "$npm_artifact" -- coderouter --version \
            | grep -Fx "coderouter $VERSION"
          UV_NO_CONFIG=1 UV_CACHE_DIR="$RUNNER_TEMP/uv-cache" \
            uvx --refresh --index-url https://pypi.org/simple \
              --from "coderouter==$VERSION" coderouter --version \
            | grep -Fx "coderouter $VERSION"
          UV_NO_CONFIG=1 UV_CACHE_DIR="$RUNNER_TEMP/uv-cache" \
            uvx --from "$wheel_artifact" coderouter --version \
            | grep -Fx "coderouter $VERSION"
