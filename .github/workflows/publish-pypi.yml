name: publish pypi

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable X.Y.Z release version
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi-coderouter
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download verified wheels
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir dist
          gh release download "v$VERSION" \
            --pattern 'coderouter-*.whl' \
            --pattern SHA256SUMS \
            --dir dist
          (cd dist && grep 'coderouter-.*\.whl$' SHA256SUMS | sha256sum --check)
          test "$(find dist -name 'coderouter-*.whl' | wc -l)" -ge 4
          rm dist/SHA256SUMS
      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist
          attestations: true
